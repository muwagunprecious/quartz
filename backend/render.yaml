services:
  - type: web
    name: campusmart-backend
    runtime: node
    buildCommand: npm run render:build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/database.db
      - key: UPLOAD_PATH
        value: /var/data/uploads
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false # Set manually in Render dashboard
    disk:
      name: campusmart-data
      mountPath: /var/data
      sizeGB: 1
